{% extends 'customer/customerbase.html' %}
{% load widget_tweaks %}
{% block content %}

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <link href="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <style type="text/css">
      a:link {
        text-decoration: none;
      }
  
      .order-card {
        color: rgb(255, 255, 255);
      }
  
      .bg-c-blue {
        background: #04868f;
      }
  
      .bg-c-green {
        background:#4C51BF;
      }
  
      .bg-c-yellow {
        background: #F56565;
      }
  
      .bg-c-pink {
        background: #663a30;
      }
  
      .card {  
        -webkit-box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
        box-shadow: 0 1px 2.94px 0.06px rgba(4, 26, 55, 0.16);
        border: 1px solid black;
        margin-bottom: 30px;
        -webkit-transition: all 0.3s ease-in-out;
        transition: all 0.3s ease-in-out;
      }
  
      .card .card-block {
        padding: 25px;
      }
  
      .order-card i {
        font-size: 26px;
      }
  
      .f-left {
        float: left;
      }
  
      .f-right {
        float: right;
      }
      
      .list-group-item {
        border: none;
        padding: 8px;
        background-color: #f8f9fa; /* Adjust as needed */
      }
      
      header {
        left: 0px;
        right: 0px;
      }
    </style>
</head>

<div class="container-fluid mt-4">
    <h2>Your Dashboard</h2>
    <form id="search-form" class="form-inline mb-3">
      <div class="input-group w-100">
          <input type="text" id="search-input" class="form-control" placeholder="Search...">
          <div class="input-group-append">
              <button type="button" id="search-button" class="btn btn-primary">Search</button>
          </div>
      </div>
    
      <div class="row">
          <div class="col-md-6">
              <label for="dropdown1">Cov Ratio</label>
              <select class="form-control" id="dropdown1">
                  <option value="option1">100%</option>
                  <option value="option2">75%</option>
                  <option value="option3">50%</option>
              </select>
          </div>
          <div class="col-md-6">
              <label for="dropdown2">Ins Dgree</label>
              <select class="form-control" id="dropdown2">
                  <option value="optionA">Gold</option>
                  <option value="optionB">Silver</option>
                  <option value="optionC">Bronze</option>
              </select>
          </div>
      </div>
    </form>
    <form action="{% url 'dashboard' %}" method="post">
      {% csrf_token %}
      <div class="row">
        <div class="col-md-6">
            <div id="search-results-container" class="list-group"></div>
        </div>
      </div>
    </form>
</div>

<script src="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/js/bootstrap.min.js"></script>

<!-- Your existing code -->

<script>
  $(document).ready(function () {
      $('#search-button').on('click', function () {
          var query = $('#search-input').val();

          $.ajax({
              url: '{% url "search_view" %}',
              type: 'GET',
              data: {'query': query},
              success: function (data) {
                  var resultsContainer = $('#search-results-container');
                  resultsContainer.empty();

                  if (data.results.length > 0) {
                      var resultList = '<ul class="list-group">';
                      data.results.forEach(function (result) {
                          resultList += '<li class="list-group-item">' + result.name + '</li>';
                          resultList += '<li class="list-group-item">' + result.description + '</li>';
                          resultList += '<button class="btn btn-primary submit-button" data-id="' + result.id + '">Submit</button>';
                      });
                      resultList += '</ul>';
                      resultsContainer.html(resultList);

                      // Add event listener for each submit button
                      $('.submit-button').on('click', function () {
                        window.alert("Your Request Was Sent Successfully!!")
                          // var recordId = $(this).data('id');

                          // // Perform AJAX request to send record ID to the backend
                          // $.ajax({
                          //     url: '{% url "submit_record" %}',  // Replace with your backend URL
                          //     type: 'POST',
                          //     data: {'record_id': recordId},
                          //     success: function (response) {
                          //         console.log('Record with ID ' + recordId + ' submitted successfully.');
                          //         // Add any additional handling based on the backend response
                          //     },
                          //     error: function (error) {
                          //         console.error('Error submitting record:', error);
                          //     }
                          // });
                      });
                  } else {
                      resultsContainer.html('<p>No results found.</p>');
                  }
              },
              error: function (error) {
                  console.log(error);
              }
          });
      });
  });
</script>

{% endblock content %}
