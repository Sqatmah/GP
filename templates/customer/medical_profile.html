{% extends 'customer/customerbase.html' %}

{% block medical_profile %}
<style>
    body {
        background-color: #f8f9fa;
    }

    .container {
        background-color: #ffffff;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 30px;
        margin-top: 50px;
    }

    .card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
    }

    .card-header {
        background-color: #007bff;
        color: #ffffff;
        font-weight: bold;
        border-radius: 15px 15px 0 0;
        padding: 15px;
        margin-bottom: 10px;
    }

    .card-body {
        padding: 20px;
        text-align: center;
    }

    .form-group {
        margin-bottom: 20px;
    }

    button {
        width: 100%;
    }

    .healthcare-form {
        max-width: 600px;
        margin: 0 auto;
    }

    .healthcare-form h2 {
        color: #007bff;
        font-weight: bold;
        text-align: center;
        margin-bottom: 30px;
    }

    .healthcare-form label {
        font-weight: bold;
        color: #333;
    }

    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
    }
</style>
</head>
<body>

<div class="container healthcare-form">
    <h2 class="mb-4">Medical Profile Form</h2>

    <form method="post" action="{% url 'medical_profile_form' %}" class="needs-validation" novalidate>
        {% csrf_token %}

        <!-- Medical Sections -->
        {% for field in form %}
            <div class="card">
                <div class="card-header">{{ field.label }}</div>
                <div class="card-body">
                    <div class="form-group">
                        {{ field.label_tag }}
                        {{ field }}
                    </div>
                </div>
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.7/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

{% endblock medical_profile %}
